[project]
name = "colmapforge"
version = "1.3.0"
description = "COLMAP video/image preprocessing tool with SAM-based dynamic object masking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vincent Qin" }]

dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "onnx>=1.14",
    "pyyaml>=6.0",
    "PyQt6>=6.6",
    "darkdetect>=0.8",
    "osam>=0.2.0",
    # Auto-download of SkyWater weights from HuggingFace Hub.
    "huggingface_hub>=0.24",
    "tqdm>=4.66",
    # ONNX Runtime is NOT a hard dependency — install via extras:
    #   uv sync --extra cpu   (all platforms, CoreML on macOS)
    #   uv sync --extra gpu   (Linux / Windows, NVIDIA CUDA)
    #
    # Or install manually after `uv sync`:
    #   uv pip install onnxruntime          # CPU
    #   uv pip install onnxruntime-gpu      # GPU (--no-deps to avoid overwrite)
]

[project.optional-dependencies]
# CPU ONNX Runtime (all platforms).  On macOS includes CoreML for Apple Silicon.
cpu = ["onnxruntime>=1.28.0"]
# CUDA acceleration — Linux & Windows only (NVIDIA GPU + CUDA runtime).
gpu = ["onnxruntime-gpu>=1.28.0"]

[project.scripts]
colmapforge = "colmapforge.app:main"
cmf = "colmapforge.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["colmapforge"]

[tool.hatch.build.targets.wheel.force-include]
"colmapforge/configs/models.yaml" = "colmapforge/configs/models.yaml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
