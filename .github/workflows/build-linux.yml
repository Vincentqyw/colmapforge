# Build COLMAP Forge for Linux — produces a distributable .tar.gz
# Triggered by version tags (v*) or manual dispatch.
name: Build (Linux)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # required by softprops/action-gh-release to upload assets

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system Qt dependencies
        # PyQt6 wheels bundle most Qt libs, but these platform packages are
        # needed at runtime for GL, EGL, X11, and cursor support on headless
        # or minimal desktop environments.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-xinerama0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (CPU-only onnxruntime)
        # CPU build keeps the bundle small; GPU users install onnxruntime-gpu
        # separately. See README → ONNX Runtime Backend section.
        run: uv sync --extra cpu --no-dev

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build executable
        # Linux/macOS --add-data separator is ':'
        run: |
          uv run pyinstaller --noconfirm --windowed --name "COLMAP-Forge" \
            --add-data "colmapforge/views/styles:colmapforge/views/styles" \
            --collect-submodules colmapforge \
            --collect-all cv2 \
            --collect-all onnxruntime \
            --hidden-import darkdetect \
            run.py

      - name: Package as tar.gz
        run: |
          cd dist
          tar -czf ../COLMAP-Forge-linux-x64.tar.gz COLMAP-Forge

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: COLMAP-Forge-linux-x64
          path: COLMAP-Forge-linux-x64.tar.gz
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: COLMAP-Forge-linux-x64.tar.gz
          generate_release_notes: true
