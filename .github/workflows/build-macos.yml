# Build COLMAP Preprocessor for macOS — produces a distributable .app.zip
# Builds for Apple Silicon (arm64). For Intel, add a second job on macos-13.
# Triggered by version tags (v*) or manual dispatch.
name: Build (macOS)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # required by softprops/action-gh-release to upload assets

jobs:
  build-macos:
    runs-on: macos-latest   # Apple Silicon (arm64 / M1+)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (CPU-only onnxruntime)
        # CPU build keeps the bundle small; GPU users install onnxruntime-gpu
        # separately. See README → ONNX Runtime Backend section.
        run: uv sync --extra cpu --no-dev

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build executable
        # --windowed on macOS creates a .app bundle automatically.
        # Linux/macOS --add-data separator is ':'
        run: |
          uv run pyinstaller --noconfirm --windowed --name "COLMAP-Preprocessor" \
            --add-data "colmap_preprocessor/views/styles:colmap_preprocessor/views/styles" \
            --collect-submodules colmap_preprocessor \
            --collect-all cv2 \
            --collect-all onnxruntime \
            --hidden-import darkdetect \
            run.py

      - name: Package as zip
        # ditto preserves macOS metadata, symlinks, and bundle structure
        # better than plain zip for .app bundles.
        run: |
          cd dist
          ditto -c -k --keepParent COLMAP-Preprocessor.app \
            ../COLMAP-Preprocessor-macos-arm64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: COLMAP-Preprocessor-macos-arm64
          path: COLMAP-Preprocessor-macos-arm64.zip
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: COLMAP-Preprocessor-macos-arm64.zip
          generate_release_notes: true
