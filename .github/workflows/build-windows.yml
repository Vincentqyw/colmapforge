# Build COLMAP Preprocessor for Windows — produces a distributable .zip
# Triggered by version tags (v*) or manual dispatch.
name: Build (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # required by softprops/action-gh-release to upload assets

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (CPU-only onnxruntime)
        # CPU build keeps the bundle small; GPU users install onnxruntime-gpu
        # separately. See README → ONNX Runtime Backend section.
        run: uv sync --extra cpu --no-dev

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build executable
        # Windows --add-data separator is ';'
        run: |
          uv run pyinstaller --noconfirm --windowed --name "COLMAP-Preprocessor" `
            --add-data "colmap_preprocessor/views/styles;colmap_preprocessor/views/styles" `
            --collect-submodules colmap_preprocessor `
            --collect-all cv2 `
            --collect-all onnxruntime `
            --hidden-import darkdetect `
            run.py

      - name: Package as zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/COLMAP-Preprocessor/* `
            -DestinationPath COLMAP-Preprocessor-windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: COLMAP-Preprocessor-windows-x64
          path: COLMAP-Preprocessor-windows-x64.zip
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: COLMAP-Preprocessor-windows-x64.zip
          generate_release_notes: true
