# SAM model registry for COLMAP Forge.
# Each entry points to a HuggingFace-hosted ONNX model (zip).
# On first launch the app creates stub config.yaml files under
#   ~/.colmapforge/models/<name>/
# and downloads the zip on first use.
#
# type: "segment_anything".  Only SAM3 is supported — it is the only SAM
# family with a native language encoder, so class prompts are passed to it
# directly as text (SAM1/SAM2/SAM2.1 were removed for being class-agnostic).

# ── Segment Anything 3 (SAM3) ────────────────────────────────────────
- name: "sam3_vit_h_20260220"
  display_name: "Segment Anything 3 (ViT-H)"
  download_url: "https://huggingface.co/vietanhdev/segment-anything-3-onnx-models/resolve/main/sam3_vit_h.zip"
  type: segment_anything
  size_hint_mb: 3000
